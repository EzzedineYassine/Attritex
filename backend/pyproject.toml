[project]
name = "attritex"
version = "1.0.0"
description = "Reproducible customer churn prediction pipeline and prediction API"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7,<3",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
]

[project.scripts]
attritex = "attritex.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2,<10",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["attritex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
